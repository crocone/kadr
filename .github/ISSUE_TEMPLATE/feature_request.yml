name: Feature request
description: Suggest something Kadr should do
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the solution. What are you working around today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Kadr to do
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture
        - Editor and annotations
        - Frames, mockups, export
        - Screen recording
        - AI features
        - Library and integrations
        - Something else
    validations:
      required: true
  - type: checkboxes
    id: plan
    attributes:
      label: Roadmap check
      options:
        - label: I looked through the open issues and this is not already asked for
